;==========================================================
;   POLYBAR MINIMAL MONOCHROME - RAM IN GB
;==========================================================

[colors]
background = #0d0d0d
background-alt = #1c1c1c
foreground = #e0e0e0
primary = #ffffff
secondary = #e0e0e0
alert = #A54242
disabled = #707880

[bar/main]
width = 100%
height = 20pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
border-size = 0

padding-left = 1
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = iosevka nerd font;2

modules-left = xworkspaces xwindow
modules-right = tray pulseaudio wlan memory battery date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
pseudo-transparency = true

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = MUT
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 3
warn-percentage = 90

[module/tray]
type = internal/tray
format-margin = 8pt
tray-spacing = 16pt
tray-padding = 4pt
tray-background = ${colors.background}
tray-foreground = ${colors.primary}
tray-scale = 0.9


[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = "WLAN %local_ip%"
label-connected-foreground = ${colors.primary}

[module/battery]
type = internal/battery

full-at = 99
low-at = 15
; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT1
adapter = ADP1

poll-interval = 5
time-format = %H:%M

format-charging = <label-charging>

format-discharging = <label-discharging>

label-charging = C %percentage%%

label-discharging = D %percentage%%

label-full = F

label-low = L

[module/date]
type = internal/date
interval = 1
date = %H:%M
label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

